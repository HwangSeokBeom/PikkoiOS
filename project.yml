name: Pikko
options:
  createIntermediateGroups: true
packages:
  KakaoSDK:
    url: https://github.com/kakao/kakao-ios-sdk
    branch: master
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
  Iamport:
    url: https://github.com/iamport/iamport-ios
    from: 1.4.7
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  Pikko:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: App
        excludes:
          - "**/* 2.swift"
          - "**/* 3.swift"
          - "**/* 4.swift"
      - path: Config
        excludes:
          - "*.xcconfig"
          - "*.plist"
          - "*.entitlements"
      - path: Core
        excludes:
          - "**/* 2.swift"
          - "**/* 3.swift"
          - "**/* 4.swift"
      - path: Domain
        excludes:
          - "**/* 2.swift"
          - "**/* 3.swift"
          - "**/* 4.swift"
      - path: Data
        excludes:
          - "**/* 2.swift"
          - "**/* 3.swift"
          - "**/* 4.swift"
      - path: DesignSystem
      - path: Shared
        excludes:
          - "**/* 2.swift"
          - "**/* 3.swift"
          - "**/* 4.swift"
      - path: Features
        excludes:
          - "**/* 2.swift"
          - "**/* 3.swift"
          - "**/* 4.swift"
      - path: Resources/Assets.xcassets
      - path: Resources/LaunchScreen.storyboard
    postBuildScripts:
      - name: Copy GoogleService-Info.plist
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist"
        script: |
          if [ -f "${PROJECT_DIR}/Config/GoogleService-Info.plist" ]; then
            mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
            cp "${PROJECT_DIR}/Config/GoogleService-Info.plist" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pikko.ios
        PRODUCT_NAME: Pikko
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Pikko-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Pikko.entitlements
        DEVELOPMENT_TEAM: 63SB2B8YJ5
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: KakaoSDK
        product: KakaoSDKAuth
      - package: KakaoSDK
        product: KakaoSDKCommon
      - package: KakaoSDK
        product: KakaoSDKUser
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
      - package: SocketIO
        product: SocketIO
      - package: Iamport
        product: iamport-ios
    scheme:
      gatherCoverageData: false
      testTargets:
        - PikkoTests
  PikkoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    hostApplication: Pikko
    configFiles:
      Debug: Config/Test.xcconfig
      Release: Config/Test.xcconfig
    sources:
      - path: Tests
        excludes:
          - "**/* 2.swift"
          - "**/* 3.swift"
          - "**/* 4.swift"
    dependencies:
      - target: Pikko
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pikko.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_PIKKO_APP_ENV: $(PIKKO_APP_ENV)
        INFOPLIST_KEY_PIKKO_BASE_URL: $(PIKKO_BASE_URL)
        INFOPLIST_KEY_PIKKO_SESAC_KEY: $(PIKKO_SESAC_KEY)
        INFOPLIST_KEY_KAKAO_NATIVE_APP_KEY: $(KAKAO_NATIVE_APP_KEY)
        INFOPLIST_KEY_GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)
        INFOPLIST_KEY_GOOGLE_REVERSED_CLIENT_ID: $(GOOGLE_REVERSED_CLIENT_ID)
        INFOPLIST_KEY_PIKKO_INTERNAL_STUB_AUTH_ENABLED: $(PIKKO_INTERNAL_STUB_AUTH_ENABLED)
        INFOPLIST_KEY_PIKKO_CHAT_SOCKET_DEBUG_ENABLED: $(PIKKO_CHAT_SOCKET_DEBUG_ENABLED)
        INFOPLIST_KEY_PORTONE_USER_CODE: $(PORTONE_USER_CODE)
        INFOPLIST_KEY_PORTONE_PG: $(PORTONE_PG)
        INFOPLIST_KEY_PORTONE_PG_ID: $(PORTONE_PG_ID)
        INFOPLIST_KEY_PORTONE_PAY_METHOD: $(PORTONE_PAY_METHOD)
        INFOPLIST_KEY_PORTONE_APP_SCHEME: $(PORTONE_APP_SCHEME)
        INFOPLIST_KEY_PAYMENT_TEST_MODE: $(PAYMENT_TEST_MODE)
